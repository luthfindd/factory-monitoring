services:
  db:
    image: mysql:8.4
    container_name: fd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: factory_db
      MYSQL_USER: factory
      MYSQL_PASSWORD: factory
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./factoryBackend
    container_name: fd-backend
    environment:
      DB_HOST: db
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8081/api
    container_name: fd-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: